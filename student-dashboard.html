<!DOCTYPE html>
<html lang="en">
<head>

    <title>CMe - Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">CMe</div>
            <ul>
                <li><a href="logout.html">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="student-dashboard">
            <h2>Student Dashboard</h2>
            <div class="student-info">

                <h4>Internships</h4>

                <p>[Percentile]</p>

        </section>

    <footer>
        <p>&copy; 2024 CMe. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</html>
