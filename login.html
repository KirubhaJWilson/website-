<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMe - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">CMe</div>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="login">
            <h2>Login</h2>
            <div class="login-container">
                <div class="login-box" id="admin-login">
                    <h3>Admin Login</h3>
                    <form>
                        <input type="email" placeholder="Email ID" required>
                        <input type="password" placeholder="Password" required>
                        <button type="submit">Login</button>
                    </form>
                </div>
                <div class="login-box" id="student-login">
                    <h3>Student Login</h3>
                    <form>
                        <input type="text" placeholder="Register Number (eg: 961623104043)" required>
                        <input type="password" placeholder="Password (DOB)" required>
                        <button type="submit">Login</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 CMe. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
