<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMe - Edit Student Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">CMe</div>
            <ul>
                <li><a href="admin-dashboard.html">Admin Dashboard</a></li>
                <li><a href="logout.html">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="edit-student">
            <h2>Edit Student Portfolio</h2>
            <form id="edit-student-form">
                <label for="student-id">Select Student:</label>
                <select id="student-id" name="student-id">
                    </select>

                <label for="assessment1">Assessment 1 Marks:</label>
                <input type="number" id="assessment1" name="assessment1">

                <label for="assessment2">Assessment 2 Marks:</label>
                <input type="number" id="assessment2" name="assessment2">

                <label for="internships">Internships:</label>
                <textarea id="internships" name="internships" rows="5"></textarea>

                <label for="passing-percentile">Passing Percentile:</label>
                <input type="number" id="passing-percentile" name="passing-percentile">

                <label for="skills">Skills:</label>
                <textarea id="skills" name="skills" rows="5"></textarea>

                <button type="submit">Update Portfolio</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 CMe. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
